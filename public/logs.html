<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>לוגים - מערכת הסכמים</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="loader-overlay">
        <div class="flex flex-col items-center">
            <div class="loader"></div>
            <p class="loader-text">טוען...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <img src="/assets/images/33.jpg" alt="Logo" class="navbar-logo" onerror="this.style.display='none'">
                    <span class="navbar-title">מערכת הסכמים</span>
                </div>
                <div class="navbar-menu">
                    <a href="/dashboard" class="navbar-link">ראשי</a>
                    <a href="/admin" class="navbar-link">ניהול משתמשים</a>
                    <a href="/logs" class="navbar-link active">לוגים</a>
                    <a href="/recycle-bin" class="navbar-link">סל מחזור</a>
                    <span class="text-secondary">|</span>
                    <span id="userName" class="text-secondary"></span>
                    <a href="#" id="logoutBtn" class="navbar-link">התנתק</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div class="flex justify-between items-center mb-lg">
            <h1 style="margin: 0;">לוגים ותקלות</h1>
            <div class="flex gap-md">
                <button class="btn btn-secondary" onclick="exportLogs()">
                    ייצוא CSV
                </button>
                <button class="btn btn-primary" onclick="loadLogs()">
                    רענן
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="dashboard-stats mb-lg" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">סה"כ לוגים</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statErrors" style="color: var(--accent-blue)">0</div>
                <div class="stat-label">שגיאות</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat24h">0</div>
                <div class="stat-label">ב-24 שעות אחרונות</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statWeek">0</div>
                <div class="stat-label">בשבוע האחרון</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-lg">
            <div class="grid grid-4">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">סוג לוג</label>
                    <select id="filterType" class="form-select" onchange="loadLogs()">
                        <option value="">הכל</option>
                        <option value="ERROR">שגיאות</option>
                        <option value="AUTH">התחברות</option>
                        <option value="SIGN">חתימות</option>
                        <option value="SEND">שליחות</option>
                        <option value="INFO">מידע</option>
                        <option value="WARNING">אזהרות</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">מתאריך</label>
                    <input type="date" id="filterFrom" class="form-input" onchange="loadLogs()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">עד תאריך</label>
                    <input type="date" id="filterTo" class="form-input" onchange="loadLogs()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">כמות</label>
                    <select id="filterLimit" class="form-select" onchange="loadLogs()">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="card">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 150px;">תאריך ושעה</th>
                            <th style="width: 100px;">סוג</th>
                            <th>פעולה</th>
                            <th style="width: 150px;">פרטים</th>
                            <th style="width: 120px;">פלטפורמה</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted p-lg">טוען לוגים...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
    <script>
        // Check auth & admin
        if (!AppUtils.requireAuth()) {
            // Will redirect
        } else if (!AppUtils.isAdmin()) {
            AppUtils.showError('הגישה מותרת למנהלים בלבד');
            setTimeout(() => window.location.href = '/dashboard', 2000);
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadLogs();
        });

        async function loadStats() {
            try {
                const result = await API.logs.getStats();
                const stats = result.data;

                document.getElementById('statTotal').textContent = stats.total;
                document.getElementById('statErrors').textContent = stats.errors;
                document.getElementById('stat24h').textContent = stats.last24Hours;
                document.getElementById('statWeek').textContent = stats.lastWeek;

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadLogs() {
            const filters = {
                type: document.getElementById('filterType').value,
                from: document.getElementById('filterFrom').value,
                to: document.getElementById('filterTo').value,
                limit: document.getElementById('filterLimit').value
            };

            // Remove empty filters
            Object.keys(filters).forEach(key => {
                if (!filters[key]) delete filters[key];
            });

            try {
                AppUtils.showLoader('טוען לוגים...');
                const result = await API.logs.getAll(filters);
                const logs = result.data;
                AppUtils.hideLoader();

                renderLogs(logs);

            } catch (error) {
                AppUtils.hideLoader();
                AppUtils.showError(error.message);
            }
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logsBody');

            if (logs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted p-lg">אין לוגים להצגה</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>
                        <div>${formatDateTime(log.timestamp)}</div>
                    </td>
                    <td>${getTypeBadge(log.type)}</td>
                    <td>
                        <div>${log.action || '-'}</div>
                        ${log.userId ? `<div class="text-sm text-muted">User: ${log.userId.substring(0, 8)}...</div>` : ''}
                    </td>
                    <td>
                        ${log.details ? `
                            <button class="btn btn-secondary btn-sm" onclick='showDetails(${JSON.stringify(log.details).replace(/'/g, "\\'")})'>
                                הצג
                            </button>
                            ${log.type === 'ERROR' ? `
                                <button class="btn btn-danger btn-sm" onclick='copyForClaude(${JSON.stringify(log).replace(/'/g, "\\'")})' title="העתק לקלוד">
                                    📋 AI
                                </button>
                            ` : ''}
                        ` : '-'}
                    </td>
                    <td class="text-sm">
                        ${getPlatformInfo(log.platform)}
                    </td>
                </tr>
            `).join('');
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('he-IL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getTypeBadge(type) {
            const types = {
                'ERROR': { class: 'badge-error', text: 'שגיאה' },
                'WARNING': { class: 'badge-draft', text: 'אזהרה' },
                'INFO': { class: 'badge-sent', text: 'מידע' },
                'AUTH': { class: 'badge-signed', text: 'התחברות' },
                'SIGN': { class: 'badge-completed', text: 'חתימה' },
                'SEND': { class: 'badge-sent', text: 'שליחה' }
            };
            const info = types[type] || { class: 'badge-draft', text: type };
            return `<span class="badge ${info.class}">${info.text}</span>`;
        }

        function getPlatformInfo(platform) {
            if (!platform) return '-';

            // Extract browser/device info
            let device = 'Desktop';
            let browser = 'Unknown';

            if (platform.includes('Mobile') || platform.includes('Android')) {
                device = 'Mobile';
            }
            if (platform.includes('iPhone') || platform.includes('iPad')) {
                device = 'iOS';
            }
            if (platform.includes('Chrome')) browser = 'Chrome';
            else if (platform.includes('Safari')) browser = 'Safari';
            else if (platform.includes('Firefox')) browser = 'Firefox';
            else if (platform.includes('Edge')) browser = 'Edge';

            return `${device} / ${browser}`;
        }

        function showDetails(details) {
            const errorText = generateClaudeText({ details, type: 'ERROR', action: 'Error details' });
            Swal.fire({
                title: 'פרטים נוספים',
                html: `
                    <pre style="text-align: left; direction: ltr; overflow: auto; max-height: 300px; background: var(--bg-secondary); padding: 10px; border-radius: 8px;">${JSON.stringify(details, null, 2)}</pre>
                    <button class="btn btn-danger mt-md" onclick="copyToClipboard(\`${errorText.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)">
                        📋 העתק את הקוד הזה ל-AI לתיקון
                    </button>
                `,
                width: 600
            });
        }

        function generateClaudeText(log) {
            const timestamp = log.timestamp ? new Date(log.timestamp).toISOString() : new Date().toISOString();
            const details = log.details || {};
            const errorMsg = details.error || 'Unknown error';

            return `=== שגיאה במערכת הסכמים ===
תאריך: ${timestamp}
פעולה: ${log.action || 'Error creating agreement'}
Endpoint: ${details.endpoint || 'POST /api/agreements'}
User: ${log.userId || 'unknown'}
IP: ${details.ip || 'unknown'}

=== הודעת שגיאה ===
${errorMsg}

=== Stack Trace ===
לא זמין

=== פרטים נוספים ===
${JSON.stringify(details, null, 2)}

=== הוראות ל-AI ===
אנא נתח את השגיאה הזו ותן פתרון.
קבצים רלוונטיים במערכת:
- server/server.js - שרת ראשי
- server/routes/agreements.js - ניהול הסכמים
- server/routes/auth.js - אימות
- server/routes/users.js - ניהול משתמשים
- server/middleware/auth.js - middleware אימות
- server/database/index.js - פעולות מסד נתונים`;
        }

        function copyForClaude(log) {
            const text = generateClaudeText(log);
            copyToClipboard(text);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                AppUtils.showToast('הועתק! הדבק בקלוד לתיקון', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                AppUtils.showToast('הועתק! הדבק בקלוד לתיקון', 'success');
            });
        }

        function exportLogs() {
            const filters = {
                type: document.getElementById('filterType').value,
                from: document.getElementById('filterFrom').value,
                to: document.getElementById('filterTo').value
            };

            // Build URL with filters
            const params = new URLSearchParams();
            Object.entries(filters).forEach(([key, value]) => {
                if (value) params.append(key, value);
            });

            const token = AppUtils.getToken();
            const url = `/api/logs/export?${params.toString()}`;

            // Download file
            fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `logs-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            })
            .catch(error => {
                AppUtils.showError('שגיאה בייצוא הלוגים');
            });
        }
    </script>
</body>
</html>
