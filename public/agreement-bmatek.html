<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הסכם במטק בע"מ - מערכת הסכמים</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="loader-overlay">
        <div class="flex flex-col items-center">
            <div class="loader"></div>
            <p class="loader-text">טוען...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <img src="/assets/images/33.jpg" alt="Logo" class="navbar-logo" onerror="this.style.display='none'">
                    <span class="navbar-title">הסכם במטק בע"מ</span>
                </div>
                <div class="navbar-menu">
                    <a href="/dashboard" class="navbar-link">חזרה ללוח בקרה</a>
                    <span class="text-secondary">|</span>
                    <span id="userName" class="text-secondary"></span>
                    <a href="#" id="logoutBtn" class="navbar-link">התנתק</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container container-md" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1 style="margin: 0; color: var(--accent-blue);">יצירת הסכם חדש</h1>
                    <p class="text-secondary mt-sm">Reshet Times מקבוצת במטק בע"מ</p>
                </div>
                <button type="button" id="contactsBtn" class="btn btn-secondary" onclick="openContactsModal()" style="display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    אנשי קשר
                </button>
            </div>

            <form id="agreementForm">
                <!-- Client Details -->
                <h3 class="mb-md">פרטי הלקוח</h3>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label" for="companyName">שם החברה / העסק</label>
                        <input type="text" id="companyName" name="companyName" class="form-input"
                               placeholder="שם החברה או העסק" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="companyId">ח.פ / עוסק מורשה</label>
                        <input type="text" id="companyId" name="companyId" class="form-input"
                               placeholder="מספר חברה או עוסק" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contactName">שם איש קשר <span class="text-secondary" style="font-size: 0.85em; font-weight: normal;">(לא חובה)</span></label>
                        <input type="text" id="contactName" name="contactName" class="form-input"
                               placeholder="שם פרטי ומשפחה">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contactId">ת.ז. <span class="text-secondary" style="font-size: 0.85em; font-weight: normal;">(לא חובה)</span></label>
                        <input type="text" id="contactId" name="contactId" class="form-input"
                               placeholder="מספר תעודת זהות">
                    </div>
                </div>

                <!-- Agreement Details -->
                <h3 class="mb-md mt-xl">פרטי ההסכם</h3>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label" for="monthlyAmount">סכום חודשי בש"ח</label>
                        <input type="number" id="monthlyAmount" name="monthlyAmount" class="form-input"
                               placeholder="סכום ללא מע״מ" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="paymentDay">יום תשלום בחודש <span class="text-secondary" style="font-size: 0.85em; font-weight: normal;">(לא חובה)</span></label>
                        <select id="paymentDay" name="paymentDay" class="form-select">
                            <option value="">בחר יום</option>
                            <option value="1">1</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                            <option value="25">25</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="effectiveDate">תאריך כניסה לתוקף</label>
                        <input type="date" id="effectiveDate" name="effectiveDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="duration">משך תקופה בחודשים</label>
                        <select id="duration" name="duration" class="form-select" required onchange="toggleCustomDuration()">
                            <option value="">בחר תקופה</option>
                            <option value="3">3 חודשים</option>
                            <option value="6">6 חודשים</option>
                            <option value="12">12 חודשים</option>
                            <option value="24">24 חודשים</option>
                            <option value="other">אחר</option>
                        </select>
                        <input type="number" id="customDuration" name="customDuration" class="form-input mt-sm"
                               placeholder="הזן מספר חודשים (לדוגמה: 18)" min="1" style="display: none;">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="agreementDate">תאריך ההסכם</label>
                        <input type="date" id="agreementDate" name="agreementDate" class="form-input">
                        <span class="form-hint">אם ריק - יהיה תאריך השליחה</span>
                    </div>
                </div>

                <!-- Notes (Optional) -->
                <div class="form-group mt-xl">
                    <label class="form-label" for="notes">הערות <span class="text-secondary" style="font-size: 0.85em; font-weight: normal;">(לא חובה)</span></label>
                    <textarea id="notes" name="notes" class="form-textarea" rows="3"
                              placeholder="הערות נוספות להסכם..."></textarea>
                </div>

                <!-- Services Selection (Hidden for now - can be enabled later) -->
                <div style="display: none;">
                    <h3 class="mb-md mt-xl">שירותים נבחרים <span class="text-secondary" style="font-size: 0.8em; font-weight: normal;">(לא חובה)</span></h3>

                    <details class="accordion">
                        <summary class="accordion-header">
                            <span>שירותים מסעיף 2.1 (AIweon - משפיענים)</span>
                            <svg class="accordion-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </summary>
                        <div class="accordion-content">
                            <textarea id="services21" name="services21" class="form-textarea"
                                      placeholder="פירוט השירותים שנבחרו מסעיף 2.1"></textarea>
                        </div>
                    </details>

                    <details class="accordion">
                        <summary class="accordion-header">
                            <span>שירותים מסעיף 2.2 (רשת טיימס)</span>
                            <svg class="accordion-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </summary>
                        <div class="accordion-content">
                            <textarea id="services22" name="services22" class="form-textarea"
                                      placeholder="פירוט השירותים שנבחרו מסעיף 2.2"></textarea>
                        </div>
                    </details>

                    <details class="accordion">
                        <summary class="accordion-header">
                            <span>שירותים מסעיף 2.3 (שירותים נוספים)</span>
                            <svg class="accordion-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </summary>
                        <div class="accordion-content">
                            <textarea id="services23" name="services23" class="form-textarea"
                                      placeholder="פירוט השירותים שנבחרו מסעיף 2.3"></textarea>
                        </div>
                    </details>
                </div>

                <!-- Submit -->
                <div class="flex gap-md mt-xl">
                    <button type="submit" class="btn btn-primary btn-lg">
                        צור הסכם ושלח
                    </button>
                    <button type="button" class="btn btn-secondary btn-lg" onclick="saveAsDraft()">
                        שמור כטיוטה
                    </button>
                    <a href="/dashboard" class="btn btn-secondary btn-lg">ביטול</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
    <script>
        // Check auth
        if (!AppUtils.requireAuth()) {
            // Will redirect
        }

        // Set default dates
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('effectiveDate').value = today;
            document.getElementById('agreementDate').value = today;
        });

        // Toggle custom duration field
        function toggleCustomDuration() {
            const durationSelect = document.getElementById('duration');
            const customDurationInput = document.getElementById('customDuration');
            if (durationSelect.value === 'other') {
                customDurationInput.style.display = 'block';
                customDurationInput.required = true;
            } else {
                customDurationInput.style.display = 'none';
                customDurationInput.required = false;
                customDurationInput.value = '';
            }
        }

        // Handle form submit
        document.getElementById('agreementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await createAndSendAgreement();
        });

        async function createAndSendAgreement() {
            const formData = getFormData();

            if (!validateForm(formData)) return;

            try {
                AppUtils.showLoader('יוצר הסכם...');
                const result = await API.agreements.create(formData);
                AppUtils.hideLoader();

                // Show send dialog
                await AppUtils.showSendDialog(result.data.id);

                // Redirect to dashboard
                window.location.href = '/dashboard';

            } catch (error) {
                AppUtils.hideLoader();
                AppUtils.showError(error.message);
            }
        }

        async function saveAsDraft() {
            const formData = getFormData();

            // Minimal validation for draft
            if (!formData.companyName) {
                AppUtils.showToast('נא להזין לפחות שם חברה', 'warning');
                return;
            }

            try {
                AppUtils.showLoader('שומר טיוטה...');
                await API.agreements.create(formData);
                AppUtils.hideLoader();
                AppUtils.showToast('הטיוטה נשמרה בהצלחה', 'success');
                setTimeout(() => window.location.href = '/dashboard', 1000);
            } catch (error) {
                AppUtils.hideLoader();
                AppUtils.showError(error.message);
            }
        }

        function getFormData() {
            const durationSelect = document.getElementById('duration').value;
            const customDuration = document.getElementById('customDuration').value.trim();
            // Extract only the number from custom duration (e.g., "4 חודש" -> "4")
            const customDurationNumber = customDuration.replace(/[^\d]/g, '');
            const duration = durationSelect === 'other' ? customDurationNumber : durationSelect;

            return {
                type: 'bmatek',
                companyName: document.getElementById('companyName').value.trim(),
                companyId: document.getElementById('companyId').value.trim(),
                contactName: document.getElementById('contactName').value.trim(),
                contactId: document.getElementById('contactId').value.trim(),
                monthlyAmount: document.getElementById('monthlyAmount').value,
                paymentDay: document.getElementById('paymentDay').value,
                effectiveDate: document.getElementById('effectiveDate').value,
                duration: duration,
                agreementDate: document.getElementById('agreementDate').value || new Date().toISOString().split('T')[0],
                notes: document.getElementById('notes').value.trim(),
                selectedServices: {
                    section21: document.getElementById('services21').value.trim(),
                    section22: document.getElementById('services22').value.trim(),
                    section23: document.getElementById('services23').value.trim()
                }
            };
        }

        function validateForm(data) {
            if (!data.companyName || !data.companyId) {
                AppUtils.showToast('נא למלא את שם החברה וח.פ/עוסק מורשה', 'warning');
                return false;
            }
            if (!data.monthlyAmount || !data.effectiveDate || !data.duration) {
                AppUtils.showToast('נא למלא את כל פרטי ההסכם', 'warning');
                return false;
            }
            // Check if custom duration is selected but empty
            const durationSelect = document.getElementById('duration').value;
            if (durationSelect === 'other' && !document.getElementById('customDuration').value.trim()) {
                AppUtils.showToast('נא להזין משך תקופה', 'warning');
                return false;
            }
            return true;
        }

        // ==================== Contacts Modal ====================
        async function openContactsModal() {
            try {
                AppUtils.showLoader('טוען אנשי קשר...');
                const result = await apiRequest('/agreements/contacts');
                AppUtils.hideLoader();

                const contacts = result.data;
                if (!contacts || contacts.length === 0) {
                    AppUtils.showToast('אין אנשי קשר קיימים', 'info');
                    return;
                }

                const listHtml = contacts.map((c, i) => `
                    <div class="contact-item" data-index="${i}" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: background 0.15s;"
                         onmouseover="this.style.background='rgba(59,130,246,0.15)'" onmouseout="this.style.background='transparent'">
                        <div style="text-align: right;">
                            <div style="font-weight: 600; font-size: 1rem;">${c.companyName}</div>
                            <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 2px;">
                                ${c.companyId ? 'ח.פ: ' + c.companyId : ''}
                                ${c.contactName ? ' | ' + c.contactName : ''}
                            </div>
                        </div>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </div>
                `).join('');

                const { value: selectedIndex } = await Swal.fire({
                    title: 'בחר איש קשר',
                    html: `
                        <div style="margin-bottom: 12px;">
                            <input type="text" id="contactSearch" class="swal2-input" placeholder="חיפוש לפי שם חברה..." style="text-align: right; margin: 0; width: 100%;">
                        </div>
                        <div id="contactsList" style="max-height: 350px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;">
                            ${listHtml}
                        </div>
                    `,
                    showConfirmButton: false,
                    showCancelButton: true,
                    cancelButtonText: 'ביטול',
                    width: '500px',
                    didOpen: () => {
                        const searchInput = document.getElementById('contactSearch');
                        const items = document.querySelectorAll('.contact-item');

                        // Search filter
                        searchInput.addEventListener('input', () => {
                            const query = searchInput.value.trim().toLowerCase();
                            items.forEach(item => {
                                const text = item.textContent.toLowerCase();
                                item.style.display = text.includes(query) ? '' : 'none';
                            });
                        });

                        // Click to select
                        items.forEach(item => {
                            item.addEventListener('click', () => {
                                Swal.close({ value: parseInt(item.dataset.index) });
                            });
                        });
                    }
                });

                if (selectedIndex === undefined || selectedIndex === null) return;

                const selected = contacts[selectedIndex];
                document.getElementById('companyName').value = selected.companyName || '';
                document.getElementById('companyId').value = selected.companyId || '';
                document.getElementById('contactName').value = selected.contactName || '';
                document.getElementById('contactId').value = selected.contactId || '';

                AppUtils.showToast('פרטי הלקוח מולאו', 'success');

            } catch (error) {
                AppUtils.hideLoader();
                AppUtils.showError('שגיאה בטעינת אנשי קשר: ' + error.message);
            }
        }
    </script>
</body>
</html>
